<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Modelo — Crachá · Instituto Urupema</title>
<link rel="stylesheet" href="componentes.css">
<style>
  @page { size: 54mm 86mm; margin: 0; }
  body { background: #d9d3c7; padding: 10mm; }
  .cracha { width: 54mm; height: var(--altura, 86mm); position: relative; overflow: hidden; border-radius: 3mm; padding: 6mm 5mm 5mm; display: flex; flex-direction: column; }
  .cracha .furo { position: absolute; top: 3mm; left: 50%; width: 11mm; height: 2.4mm; margin-left: -5.5mm; border-radius: 2mm; background: #d9d3c7; }
  .cracha .simbolo-campo { width: 32mm; left: 11mm; top: calc(var(--altura, 86mm) - 20mm); }
  .cracha img.marca { height: 14.5mm; margin: -0.9mm 0 -2.9mm -2.9mm; align-self: flex-start; }
  .cracha .nome { font: 400 16pt/1 var(--fonte-institucional); font-variation-settings: "opsz" 48; letter-spacing: -0.01em; margin: 4mm 0 1.5mm; }
  .cracha .funcao { font-size: 7pt; line-height: 1.35; margin: 0; }
  .cracha .registro { margin-top: 5mm; --colunas: 2; column-gap: 4mm; padding-top: 1.6mm; border-top-width: .6px; }
  .cracha .registro dt { font-size: 4.6pt; }
  .cracha .registro dd { font-size: 6.4pt; }
</style>
</head>
<body>
<section class="cracha campo escuro">
  <img class="simbolo-campo" src="../logo/simbolo-campo-escuro.svg" alt="">
  <span class="furo"></span>
  <img class="marca" src="../logo/assinatura-horizontal-mono-negativa.svg" alt="Instituto Urupema">
  <p class="nome">Rafaela Almeida Costa</p>
  <p class="funcao">Coordenação de Parcerias<br>Pesquisa e Desenvolvimento</p>
  <dl class="registro">
    <div><dt>Acesso</dt><dd>Sala de máquinas 1</dd></div>
    <div><dt>Registro</dt><dd>IU-0417</dd></div>
  </dl>
</section>
</body>
</html>
