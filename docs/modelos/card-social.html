<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Modelo — Card social 1200 × 630 · Instituto Urupema</title>
<link rel="stylesheet" href="componentes.css">
<style>
  body { background: #d9d3c7; }
  .card { width: 1200px; height: 630px; position: relative; overflow: hidden; background: var(--papel-fundo); padding: 64px 72px 56px; display: flex; flex-direction: column; margin-bottom: 40px; }
  .card .simbolo-campo { width: 600px; left: 780px; top: 15px; }
  .card img.marca { height: 58px; margin: -16px 0 0 -16px; width: auto; align-self: flex-start; }
  .card .rotulo { font-size: 15px; margin-top: auto; margin-bottom: 20px; }
  .card h1 { font-size: 64px; line-height: 1.0; max-width: 680px; }
  .card.escuro .simbolo-campo { width: 760px; left: 640px; top: -70px; }
  .card.escuro h1 { max-width: 560px; }
</style>
</head>
<body>
<section class="card campo">
  <img class="simbolo-campo" src="../logo/simbolo-campo.svg" alt="">
  <img class="marca" src="../logo/assinatura-horizontal-mono.svg" alt="Instituto Urupema">
  <p class="rotulo">Chamada de parceria · até 30 nov 2026</p>
  <h1 class="exibicao">Procuramos secretarias que queiram cooperar com dados de saúde</h1>
</section>
<section class="card campo escuro">
  <img class="simbolo-campo" src="../logo/simbolo-campo-escuro.svg" alt="">
  <img class="marca" src="../logo/assinatura-horizontal-mono-negativa.svg" alt="Instituto Urupema">
  <p class="rotulo">Relatório técnico · 30 set 2026</p>
  <h1 class="exibicao">Doze semanas de consultas conjuntas sem mover um registro</h1>
</section>
</body>
</html>
